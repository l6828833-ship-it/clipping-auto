# fly.toml app configuration file generated for clipping-auto on 2026-08-12T16:59:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clipping-auto'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'clipping_data'
  destination = '/app/.data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
